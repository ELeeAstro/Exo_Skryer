[project]
name = "Exo_Skryer"
description = "A JAX accelerated sub-stellar atmosphere retrieval code"
readme = "README.rst"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [
  { name = "Elspeth K. H. Lee", email = "elspeth.lee@unibe.ch" },
]
dependencies = [
  "numpy",
  "scipy",
  "jax",
  "jaxlib",
  "jaxns>=3",
  "numpyro",
  "blackjax[progress]>=1.7",
  "anesthetic",
  "arviz",
  "pyyaml",
  "optimistix",
  "distrax",
  "tfp-nightly",
  "dynesty",
  "ultranest",
  "nautilus-sampler",
  "matplotlib",
  "h5py",
  "netCDF4",
  "zarr>=3.0",
  "tqdm",
  "seaborn",
  "corner",
]
dynamic = ["version"]

[project.scripts]
exo-skryer = "exo_skryer.run_retrieval:main"

[project.optional-dependencies]
gpu = [
    "jax[cuda13]",
]
rocm = [
    # Use the system ROCm installation. JAX constrains jaxlib, the ROCm plugin,
    # and PJRT to mutually compatible versions through this extra.
    "jax[rocm7-local]",
]
atmodeller = [
    "atmodeller",
]
pymultinest = [
    "pymultinest",
]
nessai = [
    "nessai",
]
all-samplers = [
    "pymultinest",
    "nessai",
]
test = [
    "pytest-doctestplus",
    "pytest",
    "tox",
]
docs = [
    "sphinx",
    "sphinx_astropy",
    "sphinx-automodapi",
    "tomli; python_version <\"3.11\"",
    "sphinx-astropy[confv2]",
    "sphinx-book-theme",
    "IPython",
    "tox",
    "pymultinest",
]

[project.urls]
repository = "https://github.com/ELeeAstro/Exo_Skryer"

[build-system]
requires = [
  "setuptools>=61.2",
  "setuptools_scm[toml]>=3.4",
  "wheel",
]
build-backend = "setuptools.build_meta"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

# Compiled, JAX-independent libraries come from conda-forge. JAX and everything
# that depends on it (numpyro, jaxns, distrax, optimistix, ...) is resolved from
# PyPI via the project dependencies so the latest JAX releases are used and no
# conda-forge jax is pulled in alongside the PyPI one.
[tool.pixi.dependencies]
python = ">=3.12,<3.15"
numpy = "*"
scipy = "*"
matplotlib = "*"
h5py = "*"
netcdf4 = "*"
zarr = ">=3.0"
pyyaml = "*"
tqdm = "*"
seaborn = "*"
corner = "*"
dynesty = "*"
ultranest = "*"
nautilus-sampler = "*"

[tool.pixi.pypi-dependencies]
exo_skryer = { path = ".", editable = true }

# NVIDIA: jax[cuda13] wheels bundle the CUDA runtime; only the driver is needed.
[tool.pixi.feature.gpu]
platforms = ["linux-64"]

# AMD: jax[rocm7-local] uses the system ROCm installation.
[tool.pixi.feature.rocm]
platforms = ["linux-64"]
activation = { env = { LLVM_PATH = "/opt/rocm/llvm" } }

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"
[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.pymultinest.dependencies]
multinest = "*"

# conda-forge's nessai brings a PyTorch that shares the OpenMP runtime with NumPy.
[tool.pixi.feature.nessai.dependencies]
nessai = "*"

[tool.pixi.environments]
default = ["atmodeller"]
cuda = ["gpu", "atmodeller"]
rocm = ["rocm", "atmodeller"]
test = ["test", "all-samplers", "pymultinest", "nessai"]
nessai = ["nessai", "atmodeller"]
docs = { features = ["docs", "pymultinest"] }
py312 = ["py312"]
py313 = ["py313"]
py314 = ["py314"]

[tool.pixi.tasks]
devices = "python -c 'import jax; print(jax.__version__, jax.devices())'"
test = "pytest --pyargs exo_skryer docs"

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.packages.find]

[tool.setuptools_scm]
write_to = "exo_skryer/version.py"

[tool.pytest.ini_options]
testpaths = [
  "exo_skryer",
  "docs",
]
doctest_plus = "enabled"
text_file_format = "rst"
addopts = "--doctest-rst"

[tool.coverage.run]
omit = [
 "exo_skryer/conftest.py",
 "exo_skryer/*setup_package*",
 "exo_skryer/tests/*",
 "exo_skryer/*/tests/*",
 "exo_skryer/extern/*",
 "exo_skryer/version*",
 "*/exo_skryer/conftest.py",
 "*/exo_skryer/*setup_package*",
 "*/exo_skryer/tests/*",
 "*/exo_skryer/*/tests/*",
 "*/exo_skryer/extern/*",
 "*/exo_skryer/version*",
]

[tool.coverage.report]
exclude_lines = [
  # Have to re-enable the standard pragma
  "pragma: no cover",
  # Don't complain about packages we have installed
  "except ImportError",
  # Don't complain if tests don't hit assertions
  "raise AssertionError",
  "raise NotImplementedError",
  # Don't complain about script hooks
  "def main(.*):",
  # Ignore branches that don't pertain to this version of Python
  "pragma: py{ignore_python_version}",
  # Don't complain about IPython completion helper
  "def _ipython_key_completions_",
]
