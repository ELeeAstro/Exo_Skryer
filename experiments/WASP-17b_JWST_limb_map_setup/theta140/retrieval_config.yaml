# WASP-17b limb angle theta = 140 deg (0 = morning/west, 180 = evening/east).
# Generated by ../make_configs.py: edit that script, not this file.
# Per-angle 1D free retrieval reproducing Alderson et al. (2026) Sec. 4.5 (POSEIDON); see make_configs.py.

data:
  obs: ../obs/W17b_limb_theta140.txt
  obs_east: None
  obs_west: None
  stellar: None

physics:
  nlay: 100
  vert_Tp: isothermal
  vert_alt: p_ref
  vert_chem: constant_vmr
  vert_mu: dynamic
  vert_cloud: None
  opac_line: os
  opac_ray: os
  opac_cia: os
  opac_cloud: deck_haze         # POSEIDON deck_haze: opaque deck + haze
  opac_special: on              # H- bound-free
  rt_scheme: transit_1d
  contri_func: False
  refraction: None

opac:
  wl_master: ../../../opac_data/os/wl_R30000.txt
  full_grid: False
  ck: False
  line:
    - {species: CH4, path: ../../../opac_data/os/CH4_R30000.zarr.zip}
    - {species: CO, path: ../../../opac_data/os/CO_R30000.zarr.zip}
    - {species: CO2, path: ../../../opac_data/os/CO2_R30000.zarr.zip}
    - {species: H2O, path: ../../../opac_data/os/H2O_R30000.zarr.zip}
    - {species: H2S, path: ../../../opac_data/os/H2S_R30000.zarr.zip}
    - {species: K, path: ../../../opac_data/os/K_R30000.zarr.zip}
    - {species: Na, path: ../../../opac_data/os/Na_R30000.zarr.zip}
    - {species: SO2, path: ../../../opac_data/os/SO2_R30000.zarr.zip}
  ray:
    - {species: H2}
    - {species: He}
  cia:
    - {species: H2-H2, path: ../../../opac_data/cia/H2-H2_2011.zarr.zip}
    - {species: H2-He, path: ../../../opac_data/cia/H2-He_2011.zarr.zip}
  special:
    - {species: H-, bf: True, ff: False}
  cloud: None

params:
  - { name: R_s,          dist: delta, value: 1.583, transform: identity, init: 1.583 }  # stellar radius [R_sun]
  - { name: p_bot,        dist: delta, value: 100.0, transform: identity, init: 100.0 }  # [bar]
  - { name: p_top,        dist: delta, value: 1e-8,  transform: identity, init: 1e-8 }   # [bar]
  - { name: log_10_p_ref, dist: delta, value: 1.0,   transform: identity, init: 1.0 }    # 10 bar, as POSEIDON
  - { name: M_p,          dist: delta, value: 0.5,   transform: identity, init: 0.5 }    # [M_jup]; g = G M_p / R_p^2 at p_ref
  - { name: R_p,    dist: uniform, low: 1.615, high: 2.185,  transform: logit, init: 1.7 }    # 0.85-1.15 x 1.9 R_jup, at p_ref
  - { name: T_iso,  dist: uniform, low: 400.0, high: 3000.0, transform: logit, init: 1200.0 } # [K]
  - { name: log_10_f_CH4 , dist: uniform, low: -12.0, high: -1.0, transform: logit, init: -6.0 }
  - { name: log_10_f_CO  , dist: uniform, low: -12.0, high: -1.0, transform: logit, init: -6.0 }
  - { name: log_10_f_CO2 , dist: uniform, low: -12.0, high: -1.0, transform: logit, init: -6.0 }
  - { name: log_10_f_H2O , dist: uniform, low: -12.0, high: -1.0, transform: logit, init: -6.0 }
  - { name: log_10_f_H2S , dist: uniform, low: -12.0, high: -1.0, transform: logit, init: -6.0 }
  - { name: log_10_f_K   , dist: uniform, low: -12.0, high: -1.0, transform: logit, init: -6.0 }
  - { name: log_10_f_Na  , dist: uniform, low: -12.0, high: -1.0, transform: logit, init: -6.0 }
  - { name: log_10_f_SO2 , dist: uniform, low: -12.0, high: -1.0, transform: logit, init: -6.0 }
  - { name: log_10_f_H-  , dist: uniform, low: -12.0, high: -1.0, transform: logit, init: -6.0 }
  # POSEIDON deck_haze: deck opaque at P_lay > 10**log_10_p_deck [bar];
  # haze kappa = n 10**log_10_a_haze sigma_0 (lambda / 0.35 um)**gamma_haze
  - { name: log_10_p_deck, dist: uniform, low: -6.0,  high: 2.0, transform: logit, init: -2.0 }
  - { name: log_10_a_haze, dist: uniform, low: -4.0,  high: 8.0, transform: logit, init: 0.0 }
  - { name: gamma_haze,    dist: uniform, low: -20.0, high: 2.0, transform: logit, init: -4.0 }

sampling:
  engine: pymultinest
  pymultinest:
    n_live_points: 2000
    evidence_tolerance: 0.5
    sampling_efficiency: 0.3
    n_iter_before_update: 100
    null_log_evidence: -1.0e99
    max_modes: 100
    mode_tolerance: -1.0e99
    seed: -1
    verbose: true
    outputfiles_basename: pymultinest_
    resume: false
    importance_nested_sampling: false
    multimodal: false
    const_efficiency_mode: false
  nautilus:                      # alternative: set engine: nautilus
    n_live: 2000
    f_live: 0.01
    n_eff: 10000
    equal_weight: true
    verbose: true
    seed: 42

runtime:
  platform: cpu
  threads: 8
