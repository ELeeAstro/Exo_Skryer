data:

  obs: ../../obs_data/WASP-80b_JWST_em.txt
  obs_east: None
  obs_west: None
  stellar: ./WASP-80.txt
  nasa9: None

physics:

  nlay: 99

  vert_Tp: MandS
  vert_alt: p_ref
  vert_chem: constant_vmr_clr
  vert_mu: dynamic
  vert_cloud: None #exponential_decay_profile

  opac_line: os
  opac_ray: None
  opac_cia: os
  opac_cloud: None
  opac_special: os
  cloud_dist: mono

  rt_scheme: emission_1d   # transit_1d | transit_1_5d | emission_1d
  em_scheme: eaa
  emission_mode: planet
  contri_func: False
  refraction: None

opac:

  wl_master: ../../opac_data/os/wl_R20000.txt
  full_grid: False
  ck: False
  ck_mix: RORR

  line:
    - {species: H2O, path: ../../opac_data/os/H2O_R20000.zarr.zip}
    - {species: CO, path: ../../opac_data/os/CO_R20000.zarr.zip}
    - {species: CO2, path: ../../opac_data/os/CO2_R20000.zarr.zip}
    - {species: CH4, path: ../../opac_data/os/CH4_R20000.zarr.zip}
    - {species: NH3, path: ../../opac_data/os/NH3_R20000.zarr.zip}
    - {species: SO2, path: ../../opac_data/os/SO2_R20000.zarr.zip}
  ray: None
  cia:
    - {species: H2-H2, path: ../../opac_data/cia/H2-H2_2011.zarr.zip}
    - {species: H2-He, path: ../../opac_data/cia/H2-He_2011.zarr.zip}
  special: None
  cloud: None

params:


  - { name: R_s, dist: delta,   value: 0.586,  transform: identity, init: 0.586 }
  - { name: p_bot, dist: delta,   value: 1000.0,  transform: identity, init: 1000.0 }
  - { name: p_top, dist: delta,   value: 1e-8, transform: identity, init: 1e-8}
  - { name: log_10_p_ref, dist: delta,   value: 1.0, transform: identity, init: 1.0}
    #- {name: f_hem, dist: delta, value: 0.25, transform: identity, init: 0.25}

  - { name: log_10_g,  dist: uniform, low: 2.5,   high: 3.5,  transform: logit, init: 3.0}
  - { name: R_p, dist: uniform, low: 0.5,   high: 1.5,  transform: logit, init: 1.4}
  - { name: s_dilute, dist: delta, value: 1.0,  transform: identity, init: 1.0}

    #- {name: T_eq, dist: uniform, low: 500.0, high: 4000.0, transform: logit, init: 800.0}
    #- {name: T_int, dist: uniform, low: 100.0, high: 700.0, transform: logit, init: 600.0}
    #- {name: log_10_k_ir, dist: uniform, low: -6, high: 3, transform: logit, init: -6}
    #- {name: log_10_gam_v, dist: uniform, low: -3, high: 2, transform: logit, init: -1.0}
    #- {name: q_irr_0, dist: uniform, low: 0.01, high: 0.666, transform: logit, init: 0.3}
    #- {name: log_10_p_t, dist: uniform, low: -7, high: 1, transform: logit, init: -2}
    #- {name: beta, dist: uniform, low: 0.01, high: 1.0, transform: logit, init: 0.5}

  - { name: a1,        dist: uniform, low: 0.02, high: 2.00, transform: logit, init: 0.50 }
  - { name: a2,        dist: uniform, low: 0.02, high: 2.00, transform: logit, init: 0.50 }
  - { name: log_10_P1, dist: uniform, low: -7.0, high: -3.0, transform: logit, init: -4.5 }  # bar
  - { name: log_10_P2, dist: uniform, low: -3.0, high: 0.0, transform: logit, init: -2.2 }  # bar
  - { name: log_10_P3, dist: uniform, low: 0.0, high:  3.0, transform: logit, init:  0.8 }  # bar
  - { name: T_ref,     dist: uniform, low: 300.0, high: 1200.0, transform: logit, init: 1000.0 }


  - { name: log_10_f_H2O, dist: uniform, low: -12,   high: -1,  transform: logit, init: -6}
  - { name: log_10_f_CO, dist: uniform, low: -12,   high: -1,  transform: logit, init: -6}
  - { name: log_10_f_CO2, dist: uniform, low: -12,   high: -1,  transform: logit, init: -6}
  - { name: log_10_f_CH4, dist: uniform, low: -12,   high: -1,  transform: logit, init: -6}
  - { name: log_10_f_NH3, dist: uniform, low: -12,   high: -1,  transform: logit, init: -6}
  - { name: log_10_f_SO2, dist: uniform, low: -12,   high: -1,  transform: logit, init: -6}


  - {name: offset_F322W2, dist: delta, value: 0, transform: identity, init: 0}  
  - {name: offset_F444W, dist: delta, value: 0, transform: identity, init: 0}  
  - {name: offset_LRS, dist: delta, value: 0, transform: identity, init: 0}  
    #- {name: offset_NRS2, dist: uniform, low: -300, high: 300, transform: logit, init: 0}

sampling:

  engine: dynesty

  nuts:
    backend: numpyro
    warmup: 100
    draws: 100
    seed: 42
    chains: 1

  jaxns:
    # ---- core NS config ----
    max_samples: 100000          # hard cap on nested-sampling iterations
    num_live_points: 1000         # live points (posterior resolution)

    # Slice sampler hyperparameters
    s: 4                         # slices per dimension (default ~4)
    k: 0                         # phantom samples (0 = off, >0 for hard posteriors)
    c: null                       # parallel chains (null -> jaxns default, ~20*D)
    allocation_target: uniform   # uniform, evidence_improving, posterior_improving
    replacement_width: null      # parallel chains; null = 10 * free parameters
    checkpoint_dir: null         # e.g. jaxns_checkpoint; resumes automatically if a checkpoint exists
    checkpoint_cadence: 3600     # minimum seconds between saves, made at the end of a pass

    # Global behaviour flags
    verbose: true               # print textual progress to CLI

    # ---- termination controls ----
    termination:
      ess: 10000                        # target effective sample size
      evidence_uncert: null            # stop when σ_logZ < 0.3
      dlogZ: 0.1                     # stop when remaining evidence small
      max_samples: 100000             # safety cap for samples
      max_num_likelihood_evaluations: null
      rtol: null
      atol: null

    # ---- posterior handling ----
    posterior_samples: 10000           # equal-weight posterior draws
    seed: 42                          # RNG seed for JAX

  blackjax_ns:
    num_live_points: 250
    num_inner_steps: 45
    num_delete: 100
    batch_size: 32                   # Particles evaluated together; sets peak memory, not the result. 0 = all at once
    dlogz_stop: -2
    seed: 42
    posterior_samples: 10000      

  # Dynesty settings
  dynesty:
    nlive: 1000
    bound: multi
    sample: auto
    dlogz: 0.1
    maxiter: null
    maxcall: null
    bootstrap: 0
    enlarge: null
    update_interval: null
    dynamic: false
    print_progress: true
    seed: 42

  # UltraNest settings
  ultranest:
    num_live_points: 1000
    min_num_live_points: 1000
    dlogz: 0.1
    max_iters: 0
    verbose: true
    show_status: true
    log_dir: ultranest_run
    resume: false

  # Nautilus settings
  nautilus:
    n_live: 1000
    n_update: null
    split_threshold: 100
    n_networks: 4
    n_batch: null
    n_like_new_bound: null
    seed: 42
    filepath: nautilus_checkpoint.hdf5
    resume: false

    f_live: 0.01
    n_shell: 1
    n_eff: null
    n_like_max: null
    discard_exploration: false
    timeout: null
    equal_weight: true
    verbose: true


  # PyMultiNest settings
  pymultinest:
    n_live_points: 100              # Number of live points
    evidence_tolerance: 0.5          # dlogZ stopping criterion
    sampling_efficiency: 0.3         # 0.8 (unimodal), 0.3 (multimodal)
    n_iter_before_update: 100        # Update interval for proposals
    null_log_evidence: -1.0e99       # Null evidence (usually leave default)
    max_modes: 100                   # Maximum number of modes to find
    mode_tolerance: -1.0e99          # Mode separation tolerance
    seed: -1                         # Random seed (-1 = random, >=0 for reproducibility)
    verbose: true                    # Print progress
    outputfiles_basename: pymultinest_ # Output/checkpoint prefix, relative to this file
    resume: false                     # Resume from previous run if interrupted
    importance_nested_sampling: false # Use importance nested sampling
    multimodal: true                 # Enable multimodal mode detection
    const_efficiency_mode: false     # Constant efficiency mode

  # nessai settings (normalising-flow proposals; needs the nessai extra)
  nessai:
    nlive: 2000                      # Number of live points
    stopping: 0.1                    # dlogZ stopping criterion
    seed: 42
    output: nessai_run               # Output/checkpoint directory, relative to this file
    resume: false                    # Continue from the checkpoint in output
    checkpoint_interval: 600         # Seconds between checkpoints
    pytorch_threads: 1               # CPU threads for flow training
    plot: false                      # Write nessai's diagnostic plots to output

  # BlackJAX persistent-sampling SMC settings
  blackjax_smc:
    num_particles: 1000              # Particles per temperature
    num_mcmc_steps: 25               # Random-walk steps per particle per temperature
    target_ess: 3.0                  # ESS target over all kept particles, as a multiple of num_particles
    max_iterations: 200              # Upper limit on temperature steps; sets the stored array size
    batch_size: 32                   # Particles per batch; lower it if memory runs out, 0 = all at once
    posterior_samples: 5000
    seed: 42
    resume: false                    # Continue from checkpoint
    checkpoint: blackjax_smc_checkpoint.npz
    checkpoint_interval: 600         # Seconds between checkpoints

  # pocoMC settings (normalising-flow preconditioning; needs the pixi pocomc environment)
  pocomc:
    n_effective: 512                 # Effective sample size per temperature
    n_active: 256                    # Particles moved per iteration
    n_total: 4096                    # Effective samples to collect at the end
    n_evidence: 4096                 # Importance samples for logZ
    batch_size: 32                   # Likelihood batch; lower it if memory runs out, null = n_active
    posterior_samples: 5000
    seed: 42
    output: pocomc_run               # State directory, relative to this file
    resume: false                    # Continue from the newest state in output
    save_every: 5                    # Iterations between state files
    pytorch_threads: 1               # CPU threads for flow training
    progress: false                  # tqdm bar; keep false for batch jobs

runtime:
  platform: cuda           # cpu | cuda | rocm
  cuda_visible_devices: 1  # or "0,1"
  threads: 1
