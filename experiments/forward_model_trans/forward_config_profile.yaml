data:

  obs: None
  obs_east: None
  obs_west: None
  stellar: None

physics:

  nlay: 99                 # replaced by the number of layers in profile.tp_file

  vert_Tp: file            # T from profile.tp_file (its pressures are the model layers)
  vert_alt: p_ref
  vert_chem: file          # VMRs from profile.vmr_file
  vert_mu: file            # mu from the mu_amu column of profile.tp_file
  vert_cloud: file         # total condensate q_c from profile.cloud_file

  opac_line: ck
  opac_ray: ck
  opac_cia: ck
  opac_cloud: file         # per-species cloud optics from profile.cloud_file
  opac_special: None
  cloud_dist: mono

  rt_scheme: transit_1d   # transit_1d | transit_1_5d | emission_1d
  em_scheme: None
  emission_mode: planet
  contri_func: False
  refraction: None

opac:

  wl_master: ../../opac_data/ck/wl_ck_R250.txt
  full_grid: True
  ck: True
  ck_mix: TRANS

  line:
    - {species: H2O, path: ../../opac_data/ck/H2O_ck_R250.zarr.zip}
    - {species: CO2, path: ../../opac_data/ck/CO2_ck_R250.zarr.zip}
    - {species: CO, path: ../../opac_data/ck/CO_ck_R250.zarr.zip}
    - {species: CH4, path: ../../opac_data/ck/CH4_ck_R250.zarr.zip}
  ray:
    - {species: H2}
    - {species: He}
  cia:
    - {species: H2-H2, path: ../../opac_data/cia/H2-H2_2011.zarr.zip}
    - {species: H2-He, path: ../../opac_data/cia/H2-He_2011.zarr.zip}
  special: None
  cloud:                   # cloud species: bulk density (g cm^-3) and n,k file
    - {species: Mg2SiO4, path: ../../nk_data/Mg2SiO4_amorph.txt, rho: 3.27}
    - {species: KCl,     path: ../../nk_data/KCl.txt,            rho: 1.98}

profile:
  tp_file: profiles/example_TpmuKzz.txt     # p_bar  T_K  mu_amu  Kzz_cm2s, one row per layer
  vmr_file: profiles/example_vmr.txt        # p_bar  <species>..., one row per layer
  cloud_file: profiles/example_clouds.txt   # p_bar  species  q_c  reff_um  sigma, one row per layer and species
  cloud_method: madt       # lxmie | madt | f18
  cloud_dist: lognormal    # lognormal | mono
  cloud_sigma: 2.0         # width where the cloud file has no sigma column
  cloud_nr: 400            # radii in the lognormal efficiency table
  f18: {Q0: 20.0, Q1: 1.0, a: 4.0}   # used with cloud_method: f18

params:

  # System parameters
  - { name: R_s,          dist: delta, value: 1.0,   transform: identity, init: 1.0 }
  # p_bot / p_top are not used with vert_Tp: file (the file sets the pressure grid)
  - { name: p_bot,        dist: delta, value: 1000.0, transform: identity, init: 1000.0 }
  - { name: p_top,        dist: delta, value: 1e-8,   transform: identity, init: 1e-8 }
  - { name: log_10_p_ref, dist: delta, value: 1.0,    transform: identity, init: 1.0 }

  # Planet parameters
  - { name: log_10_g, dist: delta, value: 3.0, transform: identity, init: 3.0 }
  - { name: R_p,      dist: delta, value: 1.0, transform: identity, init: 1.0 }

  # T-p, mu, Kzz, VMRs and clouds come from the profile files (profile: section)

runtime:
  platform: cpu
  cuda_visible_devices: 0
  threads: 1
