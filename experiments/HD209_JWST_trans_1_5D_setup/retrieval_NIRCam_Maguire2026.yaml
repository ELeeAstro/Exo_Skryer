# HD209458b morning/evening (1.5D) limb retrieval: JWST NIRCam F322W2 + F444W, Maguire et al. (arXiv:2609.16834), Eureka!/harmonica, circular orbit.
# Setup 'NIRCam_Maguire2026', 15 free parameters, 45 + 45 data points.
# Originally generated by limb_survey/make_limb_configs.py (since removed); edit this file directly.
# Offsets [ppm] are added to the data of their group; groups fixed to 0 are the reference.

data:
  obs: None
  obs_east: NIRCam_Maguire2026_evening_east.txt
  obs_west: NIRCam_Maguire2026_morning_west.txt
  stellar: None

physics:
  nlay: 99
  vert_Tp: Barstow
  vert_alt: p_ref
  vert_chem: constant_vmr_clr
  vert_mu: dynamic
  vert_cloud: slab
  opac_line: os
  opac_ray: os
  opac_cia: os
  opac_cloud: grey_profile
  opac_special: None
  rt_scheme: transit_1_5d
  contri_func: False
  refraction: None

opac:
  wl_master: ../../opac_data/os/wl_R20000.txt
  full_grid: False
  ck: False
  line:
    - {species: H2O, path: ../../opac_data/os/H2O_R20000.zarr.zip}
    - {species: CO2, path: ../../opac_data/os/CO2_R20000.zarr.zip}
    - {species: CO, path: ../../opac_data/os/CO_R20000.zarr.zip}
    - {species: CH4, path: ../../opac_data/os/CH4_R20000.zarr.zip}
    - {species: H2S, path: ../../opac_data/os/H2S_R20000.zarr.zip}
  ray:
    - {species: H2}
    - {species: He}
  cia:
    - {species: H2-H2, path: ../../opac_data/cia/H2-H2_2011.zarr.zip}
    - {species: H2-He, path: ../../opac_data/cia/H2-He_2011.zarr.zip}
  special: None
  cloud: None

params:
  # transit_1_5d: every name ends in _joint, _east (evening) or _west (morning).
  - { name: R_s_joint, dist: delta, value: 1.2, transform: identity, init: 1.2 }
  - { name: p_bot_joint, dist: delta, value: 100.0, transform: identity, init: 100.0 }
  - { name: p_top_joint, dist: delta, value: 1e-08, transform: identity, init: 1e-08 }
  - { name: log_10_p_ref_joint, dist: delta, value: 1.0, transform: identity, init: 1.0 }
  - { name: log_10_g_joint, dist: uniform, low: 2.7, high: 3.2, transform: logit, init: 2.97 }
  - { name: R_p_joint, dist: uniform, low: 1.1, high: 1.7, transform: logit, init: 1.39 }
  - { name: log_10_f_H2O_joint, dist: uniform, low: -12, high: -1, transform: logit, init: -3.5 }
  - { name: log_10_f_CO2_joint, dist: uniform, low: -12, high: -1, transform: logit, init: -5 }
  - { name: log_10_f_CO_joint, dist: uniform, low: -12, high: -1, transform: logit, init: -3.5 }
  - { name: log_10_f_CH4_joint, dist: uniform, low: -12, high: -1, transform: logit, init: -6 }
  - { name: log_10_f_H2S_joint, dist: uniform, low: -12, high: -1, transform: logit, init: -5 }
  - { name: log_10_dp_slab_joint, dist: uniform, low: -4, high: 2, transform: logit, init: 0 }
  - { name: offset_F322W2_joint, dist: delta, value: 0.0, transform: identity, init: 0.0 }
  - { name: offset_F444W_joint, dist: uniform, low: -100.0, high: 100.0, transform: logit, init: 0.0 }
  - { name: T_strat_east, dist: uniform, low: 300.0, high: 2500.0, transform: logit, init: 1400.0 }
  - { name: log_10_p_top_slab_east, dist: uniform, low: -6, high: 2, transform: logit, init: -2 }
  - { name: log_10_k_cld_grey_east, dist: uniform, low: -8, high: 2, transform: logit, init: -2 }
  - { name: T_strat_west, dist: uniform, low: 300.0, high: 2500.0, transform: logit, init: 1300.0 }
  - { name: log_10_p_top_slab_west, dist: uniform, low: -6, high: 2, transform: logit, init: -2 }
  - { name: log_10_k_cld_grey_west, dist: uniform, low: -8, high: 2, transform: logit, init: -2 }

sampling:
  engine: nautilus
  nautilus:
    n_live: 1000
    f_live: 0.0952        # = dynesty dlogz 0.1 (1 - exp(-0.1))
    n_shell: 1
    n_eff: 10000
    discard_exploration: false
    equal_weight: true
    verbose: true
    seed: 42

runtime:
  platform: cpu
  cuda_visible_devices: 0
  threads: 12
