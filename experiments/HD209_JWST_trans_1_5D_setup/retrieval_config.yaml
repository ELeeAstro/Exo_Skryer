# HD 209458b, JWST NIRCam F322W2 + F444W morning/evening limb spectra: transit_1_5d benchmark.
# Follows the Exo Skryer 1.5D free-chemistry setup of arXiv:2609.16834 (HD 209458b asymmetric limbs):
#   isothermal limbs with T_morn = T_eve + delta (delta <= 0), free constant VMRs (H2O, CO2, CH4, CO),
#   ck R = 250, 99 layers 1e-8 - 1e2 bar, grey cloud above a base pressure, shared R_p / g / P_ref,
#   F444W offset, dynesty 1500 live points.
# Prior bounds marked [paper] are verbatim from the paper text; [appendix?] were only available from a
# summary of the appendix tables and should be checked against the PDF.
data:

  # Limb spectra (Eureka!, harmonica, circular orbit) in the transit_1_5d convention (half-annulus
  # depths), written by prepare_limb_obs.py. east = evening, west = morning.
  obs: None
  obs_east: HD209b_NIRCam_evening_east_half.txt
  obs_west: HD209b_NIRCam_morning_west_half.txt
  stellar: None

physics:

  nlay: 99

  vert_Tp: isothermal
  vert_alt: p_ref
  vert_chem: constant_vmr
  vert_mu: dynamic
  vert_cloud: f_sed

  opac_line: ck
  opac_ray: ck
  opac_cia: ck
  opac_cloud: grey_profile
  opac_special: None

  rt_scheme: transit_1_5d   # transit_1d | transit_1_5d
  contri_func: False
  refraction: None

opac:

  wl_master: ../../opac_data/ck/wl_ck_R250.txt
  full_grid: False
  ck: True
  ck_mix: TRANS

  line:
    - {species: H2O, path: ../../opac_data/ck/H2O_ck_R250.zarr.zip}
    - {species: CO2, path: ../../opac_data/ck/CO2_ck_R250.zarr.zip}
    - {species: CH4, path: ../../opac_data/ck/CH4_ck_R250.zarr.zip}
    - {species: CO, path: ../../opac_data/ck/CO_ck_R250.zarr.zip}
  ray:
    - {species: H2}
    - {species: He}
  cia:
    - {species: H2-H2, path: ../../opac_data/cia/H2-H2_2011.zarr.zip}
    - {species: H2-He, path: ../../opac_data/cia/H2-He_2011.zarr.zip}
  special: None
  cloud: None

params:

  # transit_1_5d: every name ends in _joint, _east or _west; delta_<name>_west = west - east offset.

  # --- Shared: star, pressure grid, radius / gravity / reference pressure [paper: shared between limbs] ---
  - { name: R_s_joint,          dist: delta,   value: 1.2,    transform: identity, init: 1.2 }   # [paper, pRT section]
  - { name: p_bot_joint,        dist: delta,   value: 100.0,  transform: identity, init: 100.0 }  # [paper] 1e2 bar
  - { name: p_top_joint,        dist: delta,   value: 1e-8,   transform: identity, init: 1e-8 }   # [paper]
  - { name: R_p_joint,          dist: uniform, low: 1.1, high: 1.7, transform: logit, init: 1.39 }  # [appendix?]
  - { name: log_10_g_joint,     dist: uniform, low: 2.5, high: 3.5, transform: logit, init: 2.97 }  # [appendix?]
  - { name: log_10_p_ref_joint, dist: uniform, low: -2.0, high: 2.0, transform: logit, init: 1.0 }  # [appendix?]

  # --- Instrument offset (half-annulus depth units: the paper's +-200 ppm on (R/R_s)^2 -> +-100 ppm) ---
  - {name: offset_F322W2_joint, dist: delta,   value: 0.0,  transform: identity, init: 0.0}
  - {name: offset_F444W_joint,  dist: uniform, low: -1.0e-4, high: 1.0e-4, transform: logit, init: 0.0}  # [appendix?]

  # --- Cloud: f_sed-type profile above P_base (exponent = alpha_cld), grey opacity kappa_cld ---
  - {name: log_10_q_c_joint,    dist: delta,   value: -1.0, transform: identity, init: -1.0}  # [appendix?] fixed

  # --- Evening (east) limb ---
  - {name: T_iso_east,          dist: uniform, low: 500.0, high: 3000.0, transform: logit, init: 1900.0}  # [appendix?]
  - {name: log_10_f_H2O_east,   dist: uniform, low: -12, high: -2, transform: logit, init: -4.0}  # [appendix?]
  - {name: log_10_f_CO2_east,   dist: uniform, low: -12, high: -2, transform: logit, init: -6.0}
  - {name: log_10_f_CH4_east,   dist: uniform, low: -12, high: -2, transform: logit, init: -9.0}
  - {name: log_10_f_CO_east,    dist: uniform, low: -12, high: -2, transform: logit, init: -6.0}
  - {name: log_10_p_base_east,  dist: uniform, low: -6, high: 2, transform: logit, init: -3.0}  # [appendix?]
  - {name: log_10_f_sed_east,   dist: uniform, low: -2, high: 2, transform: logit, init: 1.0}   # alpha_cld [appendix?]
  - {name: log_10_k_cld_grey_east, dist: uniform, low: -6, high: 6, transform: logit, init: 0.0}  # kappa_cld [appendix?]

  # --- Morning (west) limb: T_iso_west = T_iso_east + delta, delta in [-500, 0] K [paper] ---
  - {name: delta_T_iso_west,    dist: uniform, low: -500.0, high: 0.0, transform: logit, init: -50.0}
  - {name: log_10_f_H2O_west,   dist: uniform, low: -12, high: -2, transform: logit, init: -4.0}
  - {name: log_10_f_CO2_west,   dist: uniform, low: -12, high: -2, transform: logit, init: -6.0}
  - {name: log_10_f_CH4_west,   dist: uniform, low: -12, high: -2, transform: logit, init: -9.0}
  - {name: log_10_f_CO_west,    dist: uniform, low: -12, high: -2, transform: logit, init: -6.0}
  - {name: log_10_p_base_west,  dist: uniform, low: -6, high: 2, transform: logit, init: -2.5}
  - {name: log_10_f_sed_west,   dist: uniform, low: -2, high: 2, transform: logit, init: 0.7}
  - {name: log_10_k_cld_grey_west, dist: uniform, low: -6, high: 6, transform: logit, init: 0.0}

sampling:

  engine: dynesty

  # NUTS / HMC settings
  nuts:
    backend: numpyro
    warmup: 100
    draws: 100
    seed: 42
    chains: 1

  # JAXNS settings
  jaxns:
    max_samples: 100000
    num_live_points: 1000
    s: 4
    k: 0
    c: null
    allocation_target: uniform   # uniform, evidence_improving, posterior_improving
    replacement_width: null      # parallel chains; null = 10 * free parameters
    checkpoint_dir: null         # e.g. jaxns_checkpoint; resumes automatically if a checkpoint exists
    checkpoint_cadence: 3600     # minimum seconds between saves, made at the end of a pass
    verbose: true

    termination:
      ess: 10000
      evidence_uncert: null
      dlogZ: 0.1
      max_samples: 100000
      max_num_likelihood_evaluations: null
      rtol: null
      atol: null

    posterior_samples: 10000
    seed: 42

  # BlackJAX nested sampling settings
  blackjax_ns:
    num_live_points: 500
    num_inner_steps: 45
    num_delete: 250
    batch_size: 32                   # Particles evaluated together; sets peak memory, not the result. 0 = all at once
    dlogz_stop: 0.1
    seed: 42
    posterior_samples: 10000

  # Dynesty settings
  dynesty:
    nlive: 1500
    bound: multi
    sample: auto
    dlogz: 0.1
    maxiter: null
    maxcall: null
    bootstrap: 0
    enlarge: null
    update_interval: null
    dynamic: false
    print_progress: true
    seed: 42

  # UltraNest settings
  ultranest:
    num_live_points: 1000
    min_num_live_points: 1000
    dlogz: 0.1
    max_iters: 0
    verbose: true
    show_status: true
    log_dir: ultranest_run
    resume: false

  # Nautilus settings
  nautilus:
    n_live: 1000
    n_update: null
    split_threshold: 100
    n_networks: 4
    n_batch: null
    n_like_new_bound: null
    seed: 42
    filepath: nautilus_checkpoint.hdf5
    resume: false

    f_live: 0.01
    n_shell: 1
    n_eff: null
    n_like_max: null
    discard_exploration: false
    timeout: null
    equal_weight: true
    verbose: true

  # PyMultiNest settings
  pymultinest:
    n_live_points: 1000
    evidence_tolerance: 0.1
    sampling_efficiency: 0.3
    n_iter_before_update: 100
    null_log_evidence: -1.0e99
    max_modes: 100
    mode_tolerance: -1.0e99
    seed: -1
    verbose: true
    outputfiles_basename: pymultinest_
    resume: false
    importance_nested_sampling: false
    multimodal: true
    const_efficiency_mode: false

  # nessai settings (normalising-flow proposals; needs the nessai extra)
  nessai:
    nlive: 2000                      # Number of live points
    stopping: 0.1                    # dlogZ stopping criterion
    seed: 42
    output: nessai_run               # Output/checkpoint directory, relative to this file
    resume: false                    # Continue from the checkpoint in output
    checkpoint_interval: 600         # Seconds between checkpoints
    pytorch_threads: 1               # CPU threads for flow training
    plot: false                      # Write nessai's diagnostic plots to output

  # BlackJAX persistent-sampling SMC settings
  blackjax_smc:
    num_particles: 1000              # Particles per temperature
    num_mcmc_steps: 25               # Random-walk steps per particle per temperature
    target_ess: 3.0                  # ESS target over all kept particles, as a multiple of num_particles
    max_iterations: 200              # Upper limit on temperature steps; sets the stored array size
    batch_size: 32                   # Particles per batch; lower it if memory runs out, 0 = all at once
    posterior_samples: 5000
    seed: 42
    resume: false                    # Continue from checkpoint
    checkpoint: blackjax_smc_checkpoint.npz
    checkpoint_interval: 600         # Seconds between checkpoints

  # pocoMC settings (normalising-flow preconditioning; needs the pixi pocomc environment)
  pocomc:
    n_effective: 512                 # Effective sample size per temperature
    n_active: 256                    # Particles moved per iteration
    n_total: 4096                    # Effective samples to collect at the end
    n_evidence: 4096                 # Importance samples for logZ
    batch_size: 32                   # Likelihood batch; lower it if memory runs out, null = n_active
    posterior_samples: 5000
    seed: 42
    output: pocomc_run               # State directory, relative to this file
    resume: false                    # Continue from the newest state in output
    save_every: 5                    # Iterations between state files
    pytorch_threads: 1               # CPU threads for flow training
    progress: false                  # tqdm bar; keep false for batch jobs

runtime:
  platform: cuda
  cuda_visible_devices: 1
  threads: 1
