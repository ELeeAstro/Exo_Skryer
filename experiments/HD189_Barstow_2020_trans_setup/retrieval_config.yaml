# ==================================================================================
# HD189733b Transmission Spectrum - Barstow 2020 Setup
# ==================================================================================

# ----------------------------------------------------------------------------------
# Data Section
# ----------------------------------------------------------------------------------
data:
  obs: ../../obs_data/HD189733b_transmission_Sing2016.txt
  obs_east: None
  obs_west: None
  stellar: None
  nasa9: ../../NASA9/

# ----------------------------------------------------------------------------------
# Physics Section
# ----------------------------------------------------------------------------------
physics:
  nlay: 99

  # Vertical structure schemes
  vert_Tp: Barstow
  vert_alt: variable_g
  vert_chem: constant_vmr
  vert_mu: dynamic
  vert_cloud: None

  # Opacity sources
  opac_line: os
  opac_ray: None
  opac_cia: None
  opac_cloud: deck_and_powerlaw
  opac_special: None
  cloud_dist: mono

  # Radiative transfer
  rt_scheme: transit_1d   # transit_1d | transit_1_5d | emission_1d
  em_scheme: eaa
  emission_mode: planet
  contri_func: false
  refraction: None

# ----------------------------------------------------------------------------------
# Opacity Section
# ----------------------------------------------------------------------------------
opac:
  wl_master: ../../opac_data/os/wl_R10000.txt
  full_grid: false
  ck: false
  ck_mix: TRANS

  # Line opacity files
  line:
    - {species: H2O, path: ../../opac_data/os/H2O_R10000.zarr.zip}

  # Rayleigh scattering species
  ray: None

  # CIA opacity files
  cia: None

  # Special opacity (e.g. H- bound-free/free-free)
  special: None

  # Cloud opacity
  cloud: None

# ----------------------------------------------------------------------------------
# Parameters Section
# ----------------------------------------------------------------------------------
params:
  # Stellar parameters
  - {name: R_s, dist: delta, value: 0.776484, transform: identity, init: 0.776484}
  #- {name: a_sm, dist: delta, value: , transform: identity, init: }

  # Atmospheric boundaries
  - {name: p_bot, dist: delta, value: 1000.0, transform: identity, init: 1000.0}
  - {name: p_top, dist: delta, value: 1e-8, transform: identity, init: 1e-8}

  # Planetary parameters
  - {name: log_10_g, dist: uniform, low: 2.9, high: 3.4, transform: logit, init: 3.0}
  - {name: R_p, dist: uniform, low: 0.9, high: 1.3, transform: logit, init: 1.0}

  # T-p profile parameters
  - {name: T_strat, dist: uniform, low: 100.0, high: 3000.0, transform: logit, init: 1500.0}

  # Chemistry parameters
  - {name: log_10_f_H2O, dist: uniform, low: -12, high: -2, transform: logit, init: -5}

  # Cloud parameters
  - {name: log_10_k_cld_grey, dist: uniform, low: -6.0, high: 6.0, transform: logit, init: -5.0}
  - {name: log_10_k_cld_Ray, dist: uniform, low: -6.0, high: 6.0, transform: logit, init: -3.0}
  - {name: alpha_cld, dist: uniform, low: 0.0, high: 6.0, transform: logit, init: 4.0}
  - {name: wl_ref_cld, dist: delta, value: 0.3, transform: identity, init: 0.3}

# ----------------------------------------------------------------------------------
# Sampling Section
# ----------------------------------------------------------------------------------
sampling:
  engine: dynesty

  # NUTS / HMC settings
  nuts:
    backend: numpyro
    warmup: 100
    draws: 200
    seed: 42
    chains: 1

  # JAXNS settings
  jaxns:
    max_samples: 100000
    num_live_points: 250
    s: 4
    k: 0
    c: null
    allocation_target: uniform   # uniform, evidence_improving, posterior_improving
    replacement_width: null      # parallel chains; null = 10 * free parameters
    checkpoint_dir: null         # e.g. jaxns_checkpoint; resumes automatically if a checkpoint exists
    checkpoint_cadence: 3600     # minimum seconds between saves, made at the end of a pass
    verbose: true

    termination:
      ess: 10000
      evidence_uncert: null
      dlogZ: 1.0
      max_samples: 100000
      max_num_likelihood_evaluations: null
      rtol: null
      atol: null

    posterior_samples: 2500
    seed: 42

  # BlackJAX nested sampling settings
  blackjax_ns:
    num_live_points: 250
    num_inner_steps: 24
    num_delete: 10
    dlogz_stop: 1.0
    seed: 42

  # Dynesty settings
  dynesty:
    nlive: 100
    bound: multi
    sample: auto
    dlogz: 1.0
    maxiter: null
    maxcall: null
    bootstrap: 0
    enlarge: null
    update_interval: null
    dynamic: false
    print_progress: true
    seed: 42

  # UltraNest settings
  ultranest:
    num_live_points: 250
    min_num_live_points: 250
    dlogz: 1.0
    max_iters: 0
    verbose: true
    show_status: true
    log_dir: ultranest_run
    resume: false

  # Nautilus settings
  nautilus:
    n_live: 1000
    n_update: null
    split_threshold: 100
    n_networks: 4
    n_batch: null
    n_like_new_bound: null
    seed: 42
    filepath: nautilus_checkpoint.hdf5
    resume: false

    f_live: 0.01
    n_shell: 1
    n_eff: null
    n_like_max: null
    discard_exploration: false
    timeout: null
    equal_weight: true
    verbose: true

  # PyMultiNest settings
  pymultinest:
    n_live_points: 250              # Number of live points
    evidence_tolerance: 1.0          # dlogZ stopping criterion
    sampling_efficiency: 0.3         # 0.8 (unimodal), 0.3 (multimodal)
    n_iter_before_update: 100        # Update interval for proposals
    null_log_evidence: -1.0e99       # Null evidence (usually leave default)
    max_modes: 100                   # Maximum number of modes to find
    mode_tolerance: -1.0e99          # Mode separation tolerance
    seed: -1                         # Random seed (-1 = random, >=0 for reproducibility)
    verbose: true                    # Print progress
    outputfiles_basename: pymultinest_ # Output/checkpoint prefix, relative to this file
    resume: true                     # Resume from previous run if interrupted
    importance_nested_sampling: false # Use importance nested sampling
    multimodal: true                 # Enable multimodal mode detection
    const_efficiency_mode: false     # Constant efficiency mode

  # nessai settings (normalising-flow proposals; needs the nessai extra)
  nessai:
    nlive: 2000                      # Number of live points
    stopping: 0.1                    # dlogZ stopping criterion
    seed: 42
    output: nessai_run               # Output/checkpoint directory, relative to this file
    resume: false                    # Continue from the checkpoint in output
    checkpoint_interval: 600         # Seconds between checkpoints
    pytorch_threads: 1               # CPU threads for flow training
    plot: false                      # Write nessai's diagnostic plots to output

  # BlackJAX persistent-sampling SMC settings
  blackjax_smc:
    num_particles: 1000              # Particles per temperature
    num_mcmc_steps: 25               # Random-walk steps per particle per temperature
    target_ess: 3.0                  # ESS target over all kept particles, as a multiple of num_particles
    max_iterations: 200              # Upper limit on temperature steps; sets the stored array size
    batch_size: 0                    # Particles per batch; 0 evaluates them all at once
    posterior_samples: 5000
    seed: 42
    resume: false                    # Continue from checkpoint
    checkpoint: blackjax_smc_checkpoint.npz
    checkpoint_interval: 600         # Seconds between checkpoints

  # pocoMC settings (normalising-flow preconditioning; needs the pixi pocomc environment)
  pocomc:
    n_effective: 512                 # Effective sample size per temperature
    n_active: 256                    # Particles moved per iteration
    n_total: 4096                    # Effective samples to collect at the end
    n_evidence: 4096                 # Importance samples for logZ
    batch_size: null                 # Likelihood batch; null = n_active
    posterior_samples: 5000
    seed: 42
    output: pocomc_run               # State directory, relative to this file
    resume: false                    # Continue from the newest state in output
    save_every: 5                    # Iterations between state files
    pytorch_threads: 1               # CPU threads for flow training
    progress: false                  # tqdm bar; keep false for batch jobs

# ----------------------------------------------------------------------------------
# Runtime Section
# ----------------------------------------------------------------------------------
runtime:
  platform: cpu
  cuda_visible_devices: 0
  threads: 1
