data:

  obs: ../../obs_data/Gliese_229B_emission.txt
  obs_east: None
  obs_west: None
  stellar: None
  nasa9: ../../NASA9/

physics:

  nlay: 99

  vert_Tp: Modified_Milne
  vert_alt: p_ref
  vert_chem: constant_vmr_clr
  vert_mu: dynamic
  vert_cloud: None

  opac_line: os
  opac_ray: os
  opac_cia: os
  opac_cloud: None
  opac_special: None
  cloud_dist: mono

  rt_scheme: emission_1d   # transit_1d | transit_1_5d | emission_1d
  emission_mode: brown_dwarf
  em_scheme: eaa
  contri_func: False
  refraction: None

opac:

  wl_master: ../../opac_data/os/OS_R20000/wl_R20000.txt
  full_grid: False
  ck: False
  ck_mix: RORR

  line:
    - {species: H2O, path: ../../opac_data/os/OS_R20000/H2O_R20000.zarr.zip}
    - {species: CO, path: ../../opac_data/os/OS_R20000/CO_R20000.zarr.zip}
    - {species: CH4, path: ../../opac_data/os/OS_R20000/CH4_R20000.zarr.zip}
    - {species: NH3, path: ../../opac_data/os/OS_R20000/NH3_R20000.zarr.zip}
    - {species: Na, path: ../../opac_data/os/OS_R20000/Na_R20000.zarr.zip}
    - {species: K, path: ../../opac_data/os/OS_R20000/K_R20000.zarr.zip}

  ray:
    - {species: H2}
    - {species: He}
  cia:
    - {species: H2-H2, path: ../../opac_data/cia/H2-H2_2011.zarr.zip}
    - {species: H2-He, path: ../../opac_data/cia/H2-He_2011.zarr.zip}
  special: None
  cloud: None

params:

  - { name: R_s,   dist: delta,   value: 0.0, transform: identity, init: 0.0}
  - { name: D,   dist: delta,   value: 10.0, transform: identity, init: 10.0}
  - { name: p_bot, dist: delta,   value: 1000.0,  transform: identity, init: 1000.0 }
  - { name: p_top, dist: delta,   value: 1e-4, transform: identity, init: 1e-4}
  - { name: log_10_p_ref, dist: delta,   value: 1.0, transform: identity, init: 1.0}
  - { name: R_p, dist: delta, value: 1.0,  transform: identity, init: 1.0}

  - { name: log_10_g,  dist: uniform, low: 4.0,   high: 6.0,  transform: logit, init: 5.0}
  - { name: log_10_f_p, dist: uniform, low: -2.0,  high: 1,  transform: logit, init: 0.0}
  - { name: M_p, dist: uniform, low: 1.0,   high: 80.0,  transform: logit, init: 1.0}
  - { name: c, dist: uniform, low: -15.63,   high: -6.66,  transform: logit, init: -11.0}

  - { name: T_ratio, dist: uniform, low: 0.01,   high: 1.0, transform: logit, init: 0.5 }
  - { name: T_int, dist: uniform, low: 500.0,   high: 1500.0, transform: logit, init: 1000.0 }
  - { name: log_10_k_ir, dist: uniform, low: -6,   high: 2,  transform: logit, init: -1}
  - { name: log_10_p_t, dist: uniform, low: -4,   high: 3,  transform: logit, init: 0}
  - { name: beta, dist: uniform, low: 0.0,   high: 3.0,  transform: logit, init: 0.5}

  # Chemistry parameters (quench_approx: CE from FastChem grid + quenching)
  #- {name: M_to_H,      dist: uniform, low: -1.0,  high: 3.0,  transform: logit, init: 0.0}
  #- {name: C_to_O,      dist: uniform, low: 0.1,   high: 2.0,  transform: logit, init: 0.55}
  #- {name: log_10_Kzz,  dist: uniform, low: 4.0,   high: 12.0, transform: logit, init: 8.0}

  - { name: log_10_f_H2O, dist: uniform, low: -12,   high: -2,  transform: logit, init: -3}
  - { name: log_10_f_CO, dist: uniform, low: -12,   high: -2,  transform: logit, init: -5}

  - { name: log_10_f_CH4, dist: uniform, low: -12,   high: -2,  transform: logit, init: -3}
  - { name: log_10_f_NH3, dist: uniform, low: -12,   high: -2,  transform: logit, init: -3}    
  - { name: log_10_f_Na, dist: uniform, low: -12,   high: -2,  transform: logit, init: -6}
  - { name: log_10_f_K, dist: uniform, low: -12,   high: -2,  transform: logit, init: -6}

# ----------------------------------------------------------------------------------
# FastChem 5D Grid (CE backend for quench_approx)
# ----------------------------------------------------------------------------------
fastchem_grid_jax:
  grid_path: ../../FastChem/fastchem_grid_5d_log10.npz
  solver:
    mode: vmap   # vmap | scan
  bounds:
    mode: clip
  species_map:

# ----------------------------------------------------------------------------------
# Quench Approximation
# ----------------------------------------------------------------------------------
quench_approx:
  quench_species:
    - CO
    - CO2
    - CH4
    - NH3
    - HCN

sampling:

  engine: pocomc

  nuts:
    backend: numpyro
    warmup: 100
    draws: 100
    seed: 42
    chains: 1

  jaxns:
    # ---- core NS config ----
    max_samples: 100000          # hard cap on nested-sampling iterations
    num_live_points: 100        # live points (posterior resolution)

    # Slice sampler hyperparameters
    s: 4                        # slices per dimension (default ~4)
    k: 0                         # phantom samples (0 = off, >0 for hard posteriors)
    c: null                       # parallel chains (null -> jaxns default, ~20*D)
    allocation_target: uniform   # uniform, evidence_improving, posterior_improving
    replacement_width: null      # parallel chains; null = 10 * free parameters
    checkpoint_dir: null         # e.g. jaxns_checkpoint; resumes automatically if a checkpoint exists
    checkpoint_cadence: 3600     # minimum seconds between saves, made at the end of a pass

    # Global behaviour flags
    verbose: true               # print textual progress to CLI

    # ---- termination controls ----
    termination:
      ess: 10000                        # target effective sample size
      evidence_uncert: null            # stop when σ_logZ < 0.3
      dlogZ: 1.0                     # stop when remaining evidence small
      max_samples: 100000             # safety cap for samples
      max_num_likelihood_evaluations: null
      rtol: null
      atol: null

    # ---- posterior handling ----
    posterior_samples: 10000           # equal-weight posterior draws
    seed: 42                          # RNG seed for JAX

  blackjax_ns:
    num_live_points: 150
    num_inner_steps: 50
    num_delete: 75
    batch_size: 32                   # Particles evaluated together; sets peak memory, not the result. 0 = all at once
    dlogz_stop: 0
    seed: 42

  # Dynesty settings
  dynesty:
    nlive: 1000
    bound: multi
    sample: auto
    dlogz: 0.1
    maxiter: null
    maxcall: null
    bootstrap: 0
    enlarge: null
    update_interval: null
    dynamic: false
    print_progress: true
    seed: 42

  # UltraNest settings
  ultranest:
    num_live_points: 1000
    min_num_live_points: 100
    dlogz: 0.1
    max_iters: 0
    verbose: true
    show_status: true
    log_dir: ultranest_run
    resume: false

  # Nautilus settings
  nautilus:
    n_live: 1000
    n_update: null
    split_threshold: 100
    n_networks: 4
    n_batch: null
    n_like_new_bound: null
    seed: 42
    filepath: nautilus_checkpoint.hdf5
    resume: false

    f_live: 0.01
    n_shell: 1
    n_eff: null
    n_like_max: null
    discard_exploration: false
    timeout: null
    equal_weight: true
    verbose: true

  # PyMultiNest settings
  pymultinest:
    n_live_points: 1000              # Number of live points
    evidence_tolerance: 0.1          # dlogZ stopping criterion
    sampling_efficiency: 0.3         # 0.8 (unimodal), 0.3 (multimodal)
    n_iter_before_update: 100        # Update interval for proposals
    null_log_evidence: -1.0e99       # Null evidence (usually leave default)
    max_modes: 100                   # Maximum number of modes to find
    mode_tolerance: -1.0e99          # Mode separation tolerance
    seed: -1                         # Random seed (-1 = random, >=0 for reproducibility)
    verbose: true                    # Print progress
    outputfiles_basename: pymultinest_ # Output/checkpoint prefix, relative to this file
    resume: false                     # Resume from previous run if interrupted
    importance_nested_sampling: false # Use importance nested sampling
    multimodal: true                 # Enable multimodal mode detection
    const_efficiency_mode: false     # Constant efficiency mode

  # nessai settings (normalising-flow proposals; needs the nessai extra)
  nessai:
    nlive: 2000                      # Number of live points
    stopping: 0.1                    # dlogZ stopping criterion
    seed: 42
    output: nessai_run               # Output/checkpoint directory, relative to this file
    resume: false                    # Continue from the checkpoint in output
    checkpoint_interval: 600         # Seconds between checkpoints
    pytorch_threads: 1               # CPU threads for flow training
    plot: false                      # Write nessai's diagnostic plots to output

  # BlackJAX persistent-sampling SMC settings
  blackjax_smc:
    num_particles: 1000              # Particles per temperature
    num_mcmc_steps: 25               # Random-walk steps per particle per temperature
    target_ess: 3.0                  # ESS target over all kept particles, as a multiple of num_particles
    max_iterations: 200              # Upper limit on temperature steps; sets the stored array size
    batch_size: 32                   # Particles per batch; lower it if memory runs out, 0 = all at once
    posterior_samples: 5000
    seed: 42
    resume: false                    # Continue from checkpoint
    checkpoint: blackjax_smc_checkpoint.npz
    checkpoint_interval: 600         # Seconds between checkpoints

  # pocoMC settings (normalising-flow preconditioning; needs the pixi pocomc environment)

  pocomc:
    n_effective: 2048                # Effective sample size per temperature
    n_active: 1024                   # Particles moved per iteration
    n_total: 4096                    # Effective samples to collect at the end
    n_evidence: 4096                 # Importance samples for logZ
    batch_size: 64                   # Likelihood batch; lower it if memory runs out, null = n_active
    posterior_samples: 5000
    seed: 42
    output: pocomc_run               # State directory, relative to this file
    resume: false                    # Continue from the newest state in output
    save_every: 100                  # Iterations between state files
    pytorch_threads: 16              # CPU threads for flow training
    progress: false                  # tqdm bar; keep false for batch jobs


runtime:
  platform: rocm
  rocm_visible_devices: "0"   # sets ROCR_VISIBLE_DEVICES; omit to see all devices
  preallocate: false          # default false
  mem_fraction: 1.0           # default is 0.75, not 1.0
