data:

  obs: ../../obs_data/WASP-17b_JWST.txt
  obs_east: None
  obs_west: None
  stellar: None

physics:

  nlay: 99       # number of atmospheric layers

  # T-P profile. Options: isothermal | guillot | modified_guillot | milne | modified_milne |
  #                        barstow | line | picket_fence | mands
  vert_Tp: isothermal

  # Altitude kernel. Options: hypsometric (constant g) | variable_g | p_ref (variable g + p_ref param)
  vert_alt: p_ref

  # Chemistry. Options: constant_vmr | constant_vmr_clr (CLR-parameterised) |
  #                     ce (FastChem equil.) | fastchem_grid_jax (FastChem 5D interpolation grid) |
  #                     rate_ce (rate-based equil.) | quench_approx
  vert_chem: constant_vmr_clr

  # Mean molecular weight. Options: dynamic (computed from VMR) | constant (uses 'mu' param) | auto
  vert_mu: dynamic

  # Cloud vertical profile. Options: none | exponential | slab | constant
  vert_cloud: slab_profile

  # Line opacity mode. Options: os (opacity sampling) | ck (correlated-k) | None (off)
  # Note: must match opac.ck: False below when using os.
  opac_line: os
  opac_ray: os    # os | ck | None
  opac_cia: os    # os | ck | None
  # Cloud opacity. Options: none | grey_const | grey_profile | powerlaw | f18 | f18_skew | direct_nk | nk_f18_blend | madt_rayleigh | lxmie
  opac_cloud: nk_f18_blend
  opac_special: os   # on (H- bound-free/free-free) | None

  cloud_dist: mono  # mono (monodisperse) | log_normal (lognormal size distribution)

  rt_scheme: transit_1d   # transit_1d | transit_1_5d | emission_1d
  contri_func: False       # True to return contribution functions alongside spectra
  refraction: None

  # --- Emission-only settings (ignored when rt_scheme: transit_1d/transit_1_5d) ---
  # em_scheme: eaa          # Emission solver. Options: eaa | toon89 | dda
  # emission_mode: planet   # planet | brown_dwarf


opac:

  wl_master: ../../opac_data/os/wl_R20000.txt
  full_grid: False   # True = use entire master grid; False = cut to observation coverage
  ck: False          # Must be False when physics.opac_line: os
  ck_mix: RORR       # CK mixing scheme (only used when ck: True). Options: RORR | PRAS | TRANS

  line:
    - {species: H2O, path: ../../opac_data/os/H2O_R20000.zarr.zip}
    - {species: CO2, path: ../../opac_data/os/CO2_R20000.zarr.zip}
    - {species: CO,  path: ../../opac_data/os/CO_R20000.zarr.zip}
    - {species: CH4, path: ../../opac_data/os/CH4_R20000.zarr.zip}
    - {species: Na,  path: ../../opac_data/os/Na_R20000.zarr.zip}
    - {species: K,   path: ../../opac_data/os/K_R20000.zarr.zip}
  ray:
    - {species: H2}
    - {species: He}
  cia:
    - {species: H2-H2, path: ../../opac_data/cia/H2-H2_2011.zarr.zip}
    - {species: H2-He, path: ../../opac_data/cia/H2-He_2011.zarr.zip}
  special:
    - {species: H-, bf: True, ff: False}
  cloud: None

params:

  # --- Fixed (delta) system parameters ---
  - { name: R_s,          dist: delta, value: 1.583,  transform: identity, init: 1.583  }  # stellar radius [R_sun]
  - { name: p_bot,        dist: delta, value: 100.0,  transform: identity, init: 100.0  }  # bottom pressure [bar]
  - { name: p_top,        dist: delta, value: 1e-8,   transform: identity, init: 1e-8   }  # top pressure [bar]
  - { name: log_10_p_ref, dist: delta, value: 1.0,    transform: identity, init: 1.0    }  # reference pressure [log10 bar]

  # --- Free planetary parameters ---
  - { name: log_10_g, dist: uniform, low: 2.2,    high: 3.3,    transform: logit, init: 3.0  }  # surface gravity [log10 cm/s^2]
  - { name: R_p,      dist: uniform, low: 1.5895, high: 2.1505, transform: logit, init: 1.8  }  # planet radius [R_jup]
  - { name: T_iso,    dist: uniform, low: 400.0,  high: 2300.0, transform: logit, init: 1500.0}  # isothermal temperature [K]

  # --- Chemistry (CLR abundances, log10 VMR) ---
  - { name: log_10_f_H2O, dist: uniform, low: -12, high: -1, transform: logit, init: -6 }
  - { name: log_10_f_CO2, dist: uniform, low: -12, high: -1, transform: logit, init: -6 }
  - { name: log_10_f_CO,  dist: uniform, low: -12, high: -1, transform: logit, init: -6 }
  - { name: log_10_f_CH4, dist: uniform, low: -12, high: -1, transform: logit, init: -6 }
  - { name: log_10_f_Na,  dist: uniform, low: -12, high: -1, transform: logit, init: -6 }
  - { name: log_10_f_K,   dist: uniform, low: -12, high: -1, transform: logit, init: -6 }
  - { name: log_10_f_H-,  dist: uniform, low: -12, high: -1, transform: logit, init: -6 }

  # --- Cloud (slab profile + nk_f18_blend opacity) ---
  - { name: log_10_q_c,        dist: uniform, low: -12, high:  0, transform: logit, init: 0 }   # cloud mass mixing ratio [log10]
  - { name: log_10_cld_r,      dist: uniform, low:  -3, high: -1, transform: logit, init: -2 }   # direct_nk particle radius [log10 micron]
  - { name: log_10_p_top_slab, dist: uniform, low:  -8, high:  2, transform: logit, init: 0 }   # slab top pressure [log10 bar]
  - { name: log_10_dp_slab,    dist: uniform, low:  -8, high: 2, transform: logit, init: 0 }   # slab thickness [log10 bar]

  - { name: cld_rho, dist: delta, value: 2.5, transform: identity, init: 2.5 }  # direct_nk particle density [g/cm^3]

  # --- F18 component parameters ---
  - { name: log_10_cld_r_f18, dist: uniform, low: -3, high: 2,   transform: logit, init: 0   }  # F18 particle radius [log10 micron]
  - { name: cld_rho_f18,      dist: delta,   value: 2.5,         transform: identity, init: 2.5 }  # F18 particle density [g/cm^3]
  - { name: cld_Q0,           dist: uniform, low: 0.1, high: 50.0, transform: logit, init: 1.0 }  # F18 Q0 (opacity scale)
  - {name: cld_Q1, dist: delta, value: 4.21, transform: identity, init: 4.21}  # F18 Q1 (opacity scale)
  - { name: cld_a,            dist: uniform, low: 3.0, high: 7.0, transform: logit, init: 4.0 }  # F18 power-law index

  # --- Wavelength nodes for n,k interpolation [micron] ---
  - { name: wl_node_0,  dist: delta, value: 7.0,  transform: identity, init: 7.0  }
  - { name: wl_node_1,  dist: delta, value: 7.5,  transform: identity, init: 7.5  }
  - { name: wl_node_2,  dist: delta, value: 8.0,  transform: identity, init: 8.0  }
  - { name: wl_node_3,  dist: delta, value: 8.25, transform: identity, init: 8.25 }
  - { name: wl_node_4,  dist: delta, value: 8.5,  transform: identity, init: 8.5  }
  - { name: wl_node_5,  dist: delta, value: 8.75, transform: identity, init: 8.75 }
  - { name: wl_node_6,  dist: delta, value: 9.0,  transform: identity, init: 9.0  }
  - { name: wl_node_7,  dist: delta, value: 9.25, transform: identity, init: 9.25 }
  - { name: wl_node_8,  dist: delta, value: 9.5,  transform: identity, init: 9.5  }
  - { name: wl_node_9,  dist: delta, value: 10.0, transform: identity, init: 10.0 }
  - { name: wl_node_10, dist: delta, value: 10.5, transform: identity, init: 10.5 }
  - { name: wl_node_11, dist: delta, value: 11.0, transform: identity, init: 11.0 }
  - { name: wl_node_12, dist: delta, value: 11.5, transform: identity, init: 11.5 }

  # --- n(λ) and k(λ) at each wavelength node ---
  - { name: n_0,  dist: uniform, low: 0.3, high: 4.0, transform: logit, init: 1.0 }
  - { name: n_1,  dist: uniform, low: 0.3, high: 4.0, transform: logit, init: 1.0 }
  - { name: n_2,  dist: uniform, low: 0.3, high: 4.0, transform: logit, init: 1.0 }
  - { name: n_3,  dist: uniform, low: 0.3, high: 4.0, transform: logit, init: 1.0 }
  - { name: n_4,  dist: uniform, low: 0.3, high: 4.0, transform: logit, init: 1.0 }
  - { name: n_5,  dist: uniform, low: 0.3, high: 4.0, transform: logit, init: 1.0 }
  - { name: n_6,  dist: uniform, low: 0.3, high: 4.0, transform: logit, init: 1.0 }
  - { name: n_7,  dist: uniform, low: 0.3, high: 4.0, transform: logit, init: 1.0 }
  - { name: n_8,  dist: uniform, low: 0.3, high: 4.0, transform: logit, init: 1.0 }
  - { name: n_9,  dist: uniform, low: 0.3, high: 4.0, transform: logit, init: 1.0 }
  - { name: n_10, dist: uniform, low: 0.3, high: 4.0, transform: logit, init: 1.0 }
  - { name: n_11, dist: uniform, low: 0.3, high: 4.0, transform: logit, init: 1.0 }
  - { name: n_12, dist: uniform, low: 0.3, high: 4.0, transform: logit, init: 1.0 }

  - { name: log_10_k_0,  dist: uniform, low: -6, high: 1, transform: logit, init: 0 }
  - { name: log_10_k_1,  dist: uniform, low: -6, high: 1, transform: logit, init: 0 }
  - { name: log_10_k_2,  dist: uniform, low: -6, high: 1, transform: logit, init: 0 }
  - { name: log_10_k_3,  dist: uniform, low: -6, high: 1, transform: logit, init: 0 }
  - { name: log_10_k_4,  dist: uniform, low: -6, high: 1, transform: logit, init: 0 }
  - { name: log_10_k_5,  dist: uniform, low: -6, high: 1, transform: logit, init: 0 }
  - { name: log_10_k_6,  dist: uniform, low: -6, high: 1, transform: logit, init: 0 }
  - { name: log_10_k_7,  dist: uniform, low: -6, high: 1, transform: logit, init: 0 }
  - { name: log_10_k_8,  dist: uniform, low: -6, high: 1, transform: logit, init: 0 }
  - { name: log_10_k_9,  dist: uniform, low: -6, high: 1, transform: logit, init: 0 }
  - { name: log_10_k_10, dist: uniform, low: -6, high: 1, transform: logit, init: 0 }
  - { name: log_10_k_11, dist: uniform, low: -6, high: 1, transform: logit, init: 0 }
  - { name: log_10_k_12, dist: uniform, low: -6, high: 1, transform: logit, init: 0 }


sampling:

  # Active engine: dynesty | jaxns | nuts | blackjax_ns | ultranest | nautilus | pymultinest | nessai | blackjax_smc | pocomc
  # Only the section matching 'engine' below is used at runtime.
  engine: dynesty

  nuts:
    backend: numpyro
    warmup: 100
    draws: 100
    seed: 42
    chains: 1

  jaxns:
    # ---- core NS config ----
    max_samples: 100000          # hard cap on nested-sampling iterations
    num_live_points: 1000         # live points (posterior resolution)

    # Slice sampler hyperparameters
    s: 4                         # slices per dimension (default ~4)
    k: 0                         # phantom samples (0 = off, >0 for hard posteriors)
    c: null                       # parallel chains (null -> jaxns default, ~20*D)
    allocation_target: uniform   # uniform, evidence_improving, posterior_improving
    replacement_width: null      # parallel chains; null = 10 * free parameters
    checkpoint_dir: null         # e.g. jaxns_checkpoint; resumes automatically if a checkpoint exists
    checkpoint_cadence: 3600     # minimum seconds between saves, made at the end of a pass

    # Global behaviour flags
    verbose: true               # print textual progress to CLI

    # ---- termination controls ----
    termination:
      ess: 10000                        # target effective sample size
      evidence_uncert: null            # stop when σ_logZ < 0.3
      dlogZ: 0.1                     # stop when remaining evidence small
      max_samples: 100000             # safety cap for samples
      max_num_likelihood_evaluations: null
      rtol: null
      atol: null

    # ---- posterior handling ----
    posterior_samples: 10000           # equal-weight posterior draws
    seed: 42                          # RNG seed for JAX

  blackjax_ns:
    num_live_points: 250
    num_inner_steps: 45
    num_delete: 100
    batch_size: 32                   # Particles evaluated together; sets peak memory, not the result. 0 = all at once
    dlogz_stop: -2
    seed: 42
    posterior_samples: 10000

  # Dynesty settings
  dynesty:
    nlive: 1000
    bound: multi
    sample: auto
    dlogz: 0.1
    maxiter: null
    maxcall: null
    bootstrap: 0
    enlarge: null
    update_interval: null
    dynamic: false
    print_progress: true
    seed: 42

  # UltraNest settings
  ultranest:
    num_live_points: 1000
    min_num_live_points: 1000
    dlogz: 0.1
    max_iters: 0
    verbose: true
    show_status: true
    log_dir: ultranest_run
    resume: false

  # Nautilus settings
  nautilus:
    n_live: 1000
    n_update: null
    split_threshold: 100
    n_networks: 4
    n_batch: null
    n_like_new_bound: null
    seed: 42
    filepath: nautilus_checkpoint.hdf5
    resume: false

    f_live: 0.01
    n_shell: 1
    n_eff: null
    n_like_max: null
    discard_exploration: false
    timeout: null
    equal_weight: true
    verbose: true

  # PyMultiNest settings
  pymultinest:
    n_live_points: 1000
    evidence_tolerance: 0.1
    sampling_efficiency: 0.3
    n_iter_before_update: 100
    null_log_evidence: -1.0e99
    max_modes: 100
    mode_tolerance: -1.0e99
    seed: -1
    verbose: true
    outputfiles_basename: pymultinest_
    resume: false
    importance_nested_sampling: false
    multimodal: true
    const_efficiency_mode: false

  # nessai settings (normalising-flow proposals; needs the nessai extra)
  nessai:
    nlive: 2000                      # Number of live points
    stopping: 0.1                    # dlogZ stopping criterion
    seed: 42
    output: nessai_run               # Output/checkpoint directory, relative to this file
    resume: false                    # Continue from the checkpoint in output
    checkpoint_interval: 600         # Seconds between checkpoints
    pytorch_threads: 1               # CPU threads for flow training
    plot: false                      # Write nessai's diagnostic plots to output

  # BlackJAX persistent-sampling SMC settings
  blackjax_smc:
    num_particles: 1000              # Particles per temperature
    num_mcmc_steps: 25               # Random-walk steps per particle per temperature
    target_ess: 3.0                  # ESS target over all kept particles, as a multiple of num_particles
    max_iterations: 200              # Upper limit on temperature steps; sets the stored array size
    batch_size: 32                   # Particles per batch; lower it if memory runs out, 0 = all at once
    posterior_samples: 5000
    seed: 42
    resume: false                    # Continue from checkpoint
    checkpoint: blackjax_smc_checkpoint.npz
    checkpoint_interval: 600         # Seconds between checkpoints

  # pocoMC settings (normalising-flow preconditioning; needs the pixi pocomc environment)
  pocomc:
    n_effective: 512                 # Effective sample size per temperature
    n_active: 256                    # Particles moved per iteration
    n_total: 4096                    # Effective samples to collect at the end
    n_evidence: 4096                 # Importance samples for logZ
    batch_size: 32                   # Likelihood batch; lower it if memory runs out, null = n_active
    posterior_samples: 5000
    seed: 42
    output: pocomc_run               # State directory, relative to this file
    resume: false                    # Continue from the newest state in output
    save_every: 5                    # Iterations between state files
    pytorch_threads: 1               # CPU threads for flow training
    progress: false                  # tqdm bar; keep false for batch jobs

runtime:
  platform: cuda           # cpu | cuda | rocm
  cuda_visible_devices: 0  # or "0,1"
  threads: 1
